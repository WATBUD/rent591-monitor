<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>591 租屋監控看板</title>
<style>
:root{
  --bg:#EEF1EF; --card:#FFFFFF; --ink:#1C2A26; --muted:#68766F; --line:#D8DEDA;
  --accent:#136F63; --accent-soft:#E3F0ED; --price:#B4530A; --price-soft:#FBEFE4;
  --danger:#A33A2E; --danger-soft:#F6E7E4; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px;max-width:760px;margin:0 auto;line-height:1.55}
header{margin:8px 0 12px}
header h1{font-size:21px;font-weight:900;letter-spacing:.5px}
header p{color:var(--muted);font-size:12.5px;margin-top:4px}

/* tabs */
.tabs{display:flex;gap:6px;margin:8px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border:none;background:transparent;font-family:inherit}
.tab.on{background:var(--accent);color:#fff}
.view{display:none}
.view.on{display:block}

.summary{font-size:12.5px;color:var(--muted);margin:2px 0 12px}

/* 訂閱卡（唯讀）*/
.sub-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.sub-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--edge,#136F63)}
.sub-card.disabled{opacity:.55}
.sub-name{font-weight:700;font-size:16px}
.sub-name .off-tag{font-size:11px;color:var(--muted);font-weight:500;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 8px;font-weight:500}
.chip.price{background:var(--price-soft);color:var(--price)}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:32px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}

/* 篩選列 */
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters .fld{display:flex;flex-direction:column;gap:4px}
.filters .fld.wide{grid-column:1 / -1}
.filters label{font-size:12px;font-weight:700;color:var(--muted)}
.filters .reset{grid-column:1 / -1;justify-self:end}
.filters .reset button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:6px 12px;font-size:12.5px;font-family:inherit;cursor:pointer}
.filters .reset button:hover{border-color:var(--accent);color:var(--accent)}
.sel-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.sel-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.filters input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.filters input[type=number]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.range-row{display:flex;align-items:center;gap:8px}
.range-row span{color:var(--muted);font-size:13px;flex-shrink:0}
.sortbar{display:flex;gap:6px;align-items:center;margin:16px 0 2px;flex-wrap:wrap}
.sortbar .lbl{font-size:12.5px;color:var(--muted);font-weight:800;margin-right:2px}
.sortbtn{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer}
.sortbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.sortbtn sup{font-size:10px;font-weight:800;margin-left:1px}
.multi-toggle{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:700;cursor:pointer;margin-left:auto}
.multi-toggle input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.sort-hint{font-size:11.5px;color:var(--muted);margin:6px 2px 0}

/* 狀態/物件卡 */
.grp-h{font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px;margin:16px 2px 8px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-title{font-size:14px;font-weight:800;margin:18px 0 2px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 15px;margin-bottom:9px;position:relative;overflow:hidden}
.lcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stripe,var(--accent))}
.lcard.removed{opacity:.7}
.lcard-row{display:flex;gap:10px}
.l-thumb{width:117px;height:117px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--line);display:block}
.l-body{flex:1;min-width:0}
.l-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.l-flag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap}
.flag-new{background:var(--accent-soft);color:var(--accent)}
.flag-down{background:var(--price-soft);color:var(--price)}
.flag-off{background:var(--danger-soft);color:var(--danger)}
.l-title{font-size:13.5px;font-weight:700;line-height:1.4}
.l-title a{color:inherit;text-decoration:none}
.l-title a:hover{color:var(--accent)}
.l-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.mchip{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:2px 7px;font-weight:600}
.mchip.price{background:var(--price-soft);color:var(--price)}
.mchip.plain{background:transparent;color:var(--muted);padding-left:0}
.strike{text-decoration:line-through;color:var(--muted);font-size:12px}
.l-note{font-size:11px;color:var(--muted);margin-top:6px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90%;text-align:center}
.toast.show{opacity:1}
.loading{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>591 租屋監控看板</h1>
  <p id="genAt">載入中…</p>
</header>

<div class="tabs">
  <button class="tab on" data-view="status" onclick="switchView('status')">狀態</button>
  <button class="tab" data-view="subs" onclick="switchView('subs')">訂閱條件</button>
  <button class="tab" data-view="watch" onclick="switchView('watch')">關注</button>
</div>

<div id="view-status" class="view on"><div class="loading">載入中…</div></div>
<div id="view-subs" class="view"><div class="loading">載入中…</div></div>
<div id="view-watch" class="view"><div class="loading">載入中…</div></div>

<div class="toast" id="toast"></div>

<script>
// ===== 對照表 =====
const REGIONS = {
  "3":{name:"新北市",sections:{"26":"板橋","43":"三重","38":"中和","37":"永和","44":"新莊","34":"新店","39":"土城","47":"蘆洲","41":"樹林","27":"汐止","50":"淡水","46":"林口","45":"泰山","48":"五股","40":"三峽","42":"鶯歌","49":"八里","28":"深坑"}},
  "1":{name:"台北市",sections:{"1":"中正","2":"大同","3":"中山","4":"松山","5":"大安","6":"萬華","7":"信義","8":"士林","9":"北投","10":"內湖","11":"南港","12":"文山"}}
};
const KINDS={"1":"整層住家","2":"獨立套房","3":"分租套房","4":"雅房"};
const LAYOUTS={"1":"1房","2":"2房","3":"3房","4":"4房以上"};
const SHAPES={"1":"公寓","2":"電梯大樓","3":"透天厝","4":"別墅"};
const EDGE=["#136F63","#B4530A","#3B5BA5","#7A4E8C","#946B2D","#A33A2E"];

// ===== 這頁完全唯讀：透過公開 raw 網址讀 repo 內的 JSON，不需要任何 token =====
// owner / repo 由 GitHub Pages 網址自動推斷（<owner>.github.io/<repo>/…），
// 換人 fork 部署也不用改；本機或非 Pages 環境則用 FALLBACK。
const FALLBACK={owner:"WATBUD",repo:"rent591-monitor",branch:"main"};
function detectRepo(){
  const h=(location.hostname||"").toLowerCase();
  const seg=location.pathname.split("/").filter(Boolean);
  if(h.endsWith(".github.io")){
    return {owner:h.slice(0,-".github.io".length),repo:seg[0]||FALLBACK.repo,branch:FALLBACK.branch};
  }
  return FALLBACK;
}
const REPO=detectRepo();
// 本機測試（file:// 或 localhost）時改讀 repo 內的相對檔案；線上才走公開 raw。
// 此頁位於 ui/ 之下，故相對 repo 根目錄要往上一層。
const LOCAL = location.protocol==="file:" || ["localhost","127.0.0.1","0.0.0.0"].includes(location.hostname);
function rawUrl(path){
  if(LOCAL) return `../${path}?t=${Date.now()}`;
  // 加時間戳避開 raw CDN 快取（約數分鐘），確保拿到較新的檔案
  return `https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${REPO.branch}/${path}?t=${Date.now()}`;
}
async function rawGet(path){
  const r=await fetch(rawUrl(path),{cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error(`讀取 ${path} 失敗（${r.status}）`);
  return r.json();
}

// ===== 狀態 =====
let subsDoc=null;                    // subscriptions.json
let watchDoc={items:{}};             // watchlist.json
let latest=null;                     // data/latest.json
let fDistrict="", fKind="", fPriceMin="", fPriceMax="";   // 狀態頁前端篩選
let sortKey="recency", sortDir="asc";                    // 單選排序：recency/price/size/time
let multiSort=false, sortChain=[];                       // 多重排序：[{key,dir},...] 依點選順序為優先序
let watchFilter="";                  // 關注頁「只看區域」

function esc(t){return(t||"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}

// ===== 載入 =====
async function boot(){
  try{
    const [s,w,l]=await Promise.all([
      rawGet("subscriptions.json").catch(()=>null),
      rawGet("watchlist.json").catch(()=>null),
      rawGet("data/latest.json").catch(()=>null),
    ]);
    subsDoc=s||{subscriptions:[],settings:{}};
    watchDoc=w?(w.items?w:{items:w}):{items:{}};
    latest=l;
    const cnt=latest?Object.keys(latest.listings||{}).length:0;
    document.getElementById("genAt").textContent=latest
      ?`最新更新 ${latest.generated_at} · 在架 ${cnt} 筆`
      :`尚無快照（等排程跑第一輪）`;
    renderStatus(); renderSubs(); renderWatch();
  }catch(e){
    document.getElementById("genAt").textContent="載入失敗："+e.message;
    const html=`<div class="empty">載入失敗：${esc(e.message)}<br>請確認 repo（${esc(REPO.owner)}/${esc(REPO.repo)}）為公開，稍後再試。</div>`;
    document.getElementById("view-status").innerHTML=html;
    document.getElementById("view-subs").innerHTML=html;
    document.getElementById("view-watch").innerHTML=html;
  }
}

// ===== 分頁 =====
function switchView(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.view===v));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  document.getElementById("view-"+v).classList.add("on");
}

// ===== 物件卡 =====
function listingMeta(r){
  const m=[];
  if(r.total_monthly!=null) m.push(`<span class="mchip price">$${Number(r.total_monthly).toLocaleString()}/月</span>`);
  if(r.extra_fee>0) m.push(`<span class="mchip price">含額外費 $${Number(r.extra_fee).toLocaleString()}</span>`);
  if(r.kind_name) m.push(`<span class="mchip">${esc(r.kind_name)}</span>`);
  if(r.rooms){let g=`${r.rooms}房`;if(r.halls)g+=`${r.halls}廳`;if(r.baths)g+=`${r.baths}衛`;m.push(`<span class="mchip">${g}</span>`);}
  if(r.size_ping) m.push(`<span class="mchip">${r.size_ping}坪</span>`);
  if(r.floor) m.push(`<span class="mchip">${esc(r.floor)}</span>`);
  const fees=r.fee_included||[],tags=r.tags||[];
  if(fees.includes("管理費")) m.push(`<span class="mchip">含管理費</span>`);
  else if(tags.includes("免管理費")) m.push(`<span class="mchip">免管理費</span>`);
  if(fees.some(f=>f.includes("車位"))) m.push(`<span class="mchip">含車位</span>`);
  else if(tags.includes("有車位")) m.push(`<span class="mchip">有車位</span>`);
  return m.join("");
}
function dateLine(r){
  const parts=[];
  if(r.updated_rel) parts.push(`🕒 ${esc(r.updated_rel)}${r.posted_at?`（約 ${esc(r.posted_at)}）`:""}`);
  else if(r.posted_at) parts.push(`🕒 更新 ${esc(r.posted_at)}`);
  if(r.first_seen) parts.push(`發現 ${esc(r.first_seen)}`);
  return parts.length?`<div class="l-note">${parts.join("　·　")}</div>`:"";
}
function listingCard(r,{flag,stripe,drop}={}){
  const flagHtml=flag?`<span class="l-flag ${flag.cls}">${flag.txt}</span>`:"";
  let meta=drop
    ? `<span class="mchip price">$${Number(drop.new_price).toLocaleString()}</span><span class="strike">$${Number(drop.old_price).toLocaleString()}</span><span class="mchip price">↓${drop.drop_pct}%</span>`
    : listingMeta(r);
  const loc=[r.district,r.community].filter(Boolean).join("・");
  const thumb=r.image?`<a href="${esc(r.url)}" target="_blank" rel="noopener"><img class="l-thumb" src="${esc(r.image)}" loading="lazy" alt=""></a>`:"";
  return `<div class="lcard ${flag&&flag.cls==='flag-off'?'removed':''}" style="--stripe:${stripe||'var(--accent)'}">
    <div class="lcard-row">
      ${thumb}
      <div class="l-body">
        <div class="l-top">
          <div class="l-title"><a href="${esc(r.url)}" target="_blank" rel="noopener">${flagHtml} ${esc(r.title)}</a></div>
        </div>
        <div class="l-meta">${meta}${loc?`<span class="mchip plain">${esc(loc)}</span>`:""}</div>
        ${dateLine(r)}
        ${r.note?`<div class="l-note">✍️ ${esc(r.note)}</div>`:""}
      </div>
    </div>
  </div>`;
}
function groupByDistrict(rows){const g={};rows.forEach(r=>{(g[r.district||"其他"]=g[r.district||"其他"]||[]).push(r);});return g;}
function byRecency(a,b){
  const pa=a.posted_at||"",pb=b.posted_at||"";
  if(pa!==pb) return pb<pa?-1:1;
  return (Number(b.listing_id)||0)-(Number(a.listing_id)||0);
}
function section(title,rows,opt){
  if(!rows||!rows.length) return "";
  let html=`<div class="sec-title">${title}（${rows.length}）</div>`;
  const g=groupByDistrict(rows.slice().sort(byRecency));
  for(const d of Object.keys(g)){
    html+=`<div class="grp-h">${esc(d)}（${g[d].length}）</div>`;
    html+=g[d].map(r=>listingCard(r,opt)).join("");
  }
  return html;
}

// ===== 狀態總覽（含前端篩選：區域 / 類型 / 租金上限）=====
function setFilter(k,v){
  if(k==="district") fDistrict=v;
  else if(k==="kind") fKind=v;
  else if(k==="priceMin") fPriceMin=v;
  else if(k==="priceMax") fPriceMax=v;
  renderStatus();
  document.getElementById("view-status").scrollIntoView({block:"start"});
}
function resetFilters(){fDistrict="";fKind="";fPriceMin="";fPriceMax="";renderStatus();document.getElementById("view-status").scrollIntoView({block:"start"});}
function setSort(key){
  if(sortKey===key){ sortDir = sortDir==="asc"?"desc":"asc"; }
  else { sortKey=key; sortDir = (key==="size"||key==="time")?"desc":"asc"; }  // 坪數/時間預設大→小(新→舊)，租金預設小→大
  renderStatus();
  document.getElementById("view-status").scrollIntoView({block:"start"});
}
function sortRows(rows){
  if(sortKey==="recency") return rows.slice().sort(byRecency);
  if(sortKey==="time"){
    const r2=rows.slice().sort(byRecency);          // byRecency 為新→舊
    return sortDir==="desc" ? r2 : r2.reverse();    // desc=新→舊，asc=舊→新
  }
  const pick = sortKey==="price" ? (r=>r.total_monthly) : (r=>r.size_ping);
  const dir = sortDir==="asc"?1:-1;
  return rows.slice().sort((a,b)=>{
    const va=pick(a), vb=pick(b);
    if(va==null&&vb==null) return 0;
    if(va==null) return 1;   // 無值一律排最後
    if(vb==null) return -1;
    return (Number(va)-Number(vb))*dir;
  });
}
function defaultDir(key){ return (key==="size"||key==="time") ? "desc" : "asc"; }  // 坪數/時間預設大→小

// 單一條件比較器（asc=1, desc=-1）。
// 注意：time 只比 posted_at 日期，同日期回 0（交給多重排序的下一條件）；
// 不可用 byRecency，因它會再以 listing_id 決勝而讓後續條件失效。
function cmpBy(key,dir){
  if(key==="time"){
    const s=dir==="desc"?1:-1;                       // desc=新→舊
    return (a,b)=>{
      const pa=a.posted_at||"", pb=b.posted_at||"";
      if(pa===pb) return 0;
      return (pb<pa?-1:1)*s;
    };
  }
  const pick = key==="price" ? (r=>r.total_monthly) : (r=>r.size_ping);
  const d = dir==="asc"?1:-1;
  return (a,b)=>{
    const va=pick(a), vb=pick(b);
    if(va==null&&vb==null) return 0;
    if(va==null) return 1; if(vb==null) return -1;   // 無值一律排最後
    return (Number(va)-Number(vb))*d;
  };
}
// 多重排序：依 sortChain 逐條件比較，全相同再以 listing_id 收尾
function sortRowsMulti(rows){
  const chain = sortChain.length ? sortChain : [{key:"time",dir:"desc"}];
  return rows.slice().sort((a,b)=>{
    for(const s of chain){ const c=cmpBy(s.key,s.dir)(a,b); if(c) return c; }
    return (Number(b.listing_id)||0)-(Number(a.listing_id)||0);
  });
}
function toggleMultiSort(){
  multiSort=!multiSort;
  // 開啟時把目前單選狀態帶入為第一條件（最新除外）
  if(multiSort) sortChain = (sortKey==="recency") ? [] : [{key:sortKey,dir:sortDir}];
  renderStatus();
  document.getElementById("view-status").scrollIntoView({block:"start"});
}
// 點排序鈕：單選走 setSort；多選則加入/切方向/移除（三態循環）
function clickSort(key){
  if(!multiSort){ setSort(key); return; }
  if(key==="recency"){ sortChain=[]; renderStatus(); return; }   // 多選模式「最新」＝清空
  const def=defaultDir(key);
  const i=sortChain.findIndex(s=>s.key===key);
  if(i<0) sortChain.push({key,dir:def});                          // 第一次：加入（預設方向）
  else if(sortChain[i].dir===def) sortChain[i].dir = def==="asc"?"desc":"asc"; // 第二次：切反向
  else sortChain.splice(i,1);                                     // 第三次：移除
  renderStatus();
  document.getElementById("view-status").scrollIntoView({block:"start"});
}
function sortBtn(key,txt){
  if(multiSort){
    if(key==="recency") return `<button class="sortbtn ${sortChain.length?'':'on'}" onclick="clickSort('recency')">${txt}</button>`;
    const i=sortChain.findIndex(s=>s.key===key), on=i>=0;
    const badge=on?`<sup>${i+1}</sup>`:"";
    const arrow=on?(sortChain[i].dir==="asc"?" ↑":" ↓"):"";
    return `<button class="sortbtn ${on?'on':''}" onclick="clickSort('${key}')">${txt}${badge}${arrow}</button>`;
  }
  const on=sortKey===key;
  const arrow = (on&&key!=="recency") ? (sortDir==="asc"?" ↑":" ↓") : "";
  return `<button class="sortbtn ${on?'on':''}" onclick="clickSort('${key}')">${txt}${arrow}</button>`;
}
function passFilter(r){
  if(fDistrict && (r.district||"其他")!==fDistrict) return false;
  if(fKind && (r.kind_name||"")!==fKind) return false;
  if(fPriceMin||fPriceMax){
    const p=r.total_monthly;
    if(p==null) return false;                       // 無租金資料，套價格篩選時排除
    if(fPriceMin && Number(p)<Number(fPriceMin)) return false;
    if(fPriceMax && Number(p)>Number(fPriceMax)) return false;
  }
  return true;
}
function renderStatus(){
  const el=document.getElementById("view-status");
  if(!latest){el.innerHTML=`<div class="empty">尚無快照。等 GitHub Actions 跑完第一輪後，這裡會顯示本輪變動與在架物件。</div>`;return;}
  const rep=latest.report||{new:[],price_drop:[],removed:[]};
  const active=Object.values(latest.listings||{}).filter(r=>r.status==="active");

  // 供下拉：各區數量、各類型數量（類型固定列 591 全部四種，0 也照列）
  const distCnt={},kindCnt={};
  active.forEach(r=>{const d=r.district||"其他";distCnt[d]=(distCnt[d]||0)+1;const k=r.kind_name||"";if(k)kindCnt[k]=(kindCnt[k]||0)+1;});
  const dists=Object.keys(distCnt).sort((a,b)=>distCnt[b]-distCnt[a]);
  if(fDistrict&&!distCnt[fDistrict]) fDistrict="";

  const flt=rows=>rows.filter(passFilter);
  const nNew=flt(rep.new),nDrop=flt(rep.price_drop),nOff=flt(rep.removed),nAct=flt(active);
  const hasFilter=fDistrict||fKind||fPriceMin||fPriceMax;

  el.innerHTML=
    `<div class="summary">每 5 分鐘自動更新一次（GitHub 排程可能延遲數分鐘）。</div>`+
    `<div class="filters">`+
      `<div class="fld"><label>區域</label><select class="sel-input" onchange="setFilter('district',this.value)">`+
        `<option value="">全部區域（${active.length}）</option>`+
        dists.map(d=>`<option value="${esc(d)}" ${fDistrict===d?"selected":""}>${esc(d)}（${distCnt[d]}）</option>`).join("")+
      `</select></div>`+
      `<div class="fld"><label>類型</label><select class="sel-input" onchange="setFilter('kind',this.value)">`+
        `<option value="">全部類型（${active.length}）</option>`+
        Object.values(KINDS).map(k=>`<option value="${esc(k)}" ${fKind===k?"selected":""}>${esc(k)}（${kindCnt[k]||0}）</option>`).join("")+
      `</select></div>`+
      `<div class="fld wide"><label>租金（元/月）</label><div class="range-row">`+
        `<input type="number" min="0" step="1000" placeholder="不限" value="${fPriceMin}" onchange="setFilter('priceMin',this.value.trim())">`+
        `<span>～</span>`+
        `<input type="number" min="0" step="1000" placeholder="不限" value="${fPriceMax}" onchange="setFilter('priceMax',this.value.trim())">`+
      `</div></div>`+
      (hasFilter?`<div class="reset"><button onclick="resetFilters()">清除篩選</button></div>`:"")+
    `</div>`+
    `<div class="summary">本輪更新 ${latest.generated_at}　🆕 ${nNew.length}｜💰 ${nDrop.length}｜❌ ${nOff.length}${hasFilter?"（已篩選）":""}</div>`;

  // 排序列（最上方）＋ 在架主清單。單選：最新/時間/租金/坪數；勾「多重排序」可疊加多條件
  el.insertAdjacentHTML("beforeend",
    `<div class="sortbar"><span class="lbl">在架排序</span>`+
    sortBtn("recency","最新")+sortBtn("time","時間")+sortBtn("price","租金")+sortBtn("size","坪數")+
    `<label class="multi-toggle"><input type="checkbox" ${multiSort?"checked":""} onchange="toggleMultiSort()">多重排序</label>`+
    `</div>`+
    (multiSort?`<div class="sort-hint">點選順序＝優先序（角標數字）；同鈕再點切換 ↑↓，第三次取消。例：租金↑＋坪數↓＝同價再看坪數大的。</div>`:""));
  const grouped = !multiSort && sortKey==="recency";
  if(!nAct.length){
    el.insertAdjacentHTML("beforeend",`<div class="empty">沒有符合條件的在架物件${hasFilter?"（試著放寬篩選）":""}。</div>`);
  }else if(grouped){
    el.insertAdjacentHTML("beforeend",section(hasFilter?"📋 符合條件的在架":"📋 全部在架",nAct,{stripe:"var(--accent)"}));
  }else{
    const actTitle=(hasFilter?"📋 符合條件的在架":"📋 全部在架")+`（${nAct.length}）`;
    el.insertAdjacentHTML("beforeend",`<div class="sec-title">${actTitle}</div>`);
    const ordered=(multiSort?sortRowsMulti:sortRows)(nAct);
    el.insertAdjacentHTML("beforeend",ordered.map(r=>listingCard(r,{stripe:"var(--accent)"})).join(""));
  }

  // 本輪變動移到下方（新增區已移除，只保留降價／下架）
  if(nDrop.length){
    el.insertAdjacentHTML("beforeend",`<div class="sec-title">💰 降價（${nDrop.length}）</div>`);
    const g=groupByDistrict(nDrop.slice().sort(byRecency));
    for(const d of Object.keys(g)){
      el.insertAdjacentHTML("beforeend",`<div class="grp-h">${esc(d)}（${g[d].length}）</div>`);
      g[d].forEach(r=>el.insertAdjacentHTML("beforeend",listingCard(r,{flag:{cls:"flag-down",txt:"💰"},stripe:"var(--price)",drop:r})));
    }
  }
  if(nOff.length) el.insertAdjacentHTML("beforeend",section("❌ 下架",nOff,{flag:{cls:"flag-off",txt:"❌"},stripe:"var(--danger)"}));
}

// ===== 訂閱條件（唯讀顯示）=====
function summaryChips(s){
  const secNames=(s.sections||[]).map(id=>REGIONS[s.region].sections[id]||id).join("、")||"全區";
  const c=[`<span class="chip">📍 ${REGIONS[s.region].name}｜${secNames}</span>`,`<span class="chip">${KINDS[s.kind]||"不限類型"}</span>`];
  if((s.layout||[]).length) c.push(`<span class="chip">${s.layout.map(l=>LAYOUTS[l]).join("、")}</span>`);
  if((s.shape||[]).length) c.push(`<span class="chip">${s.shape.map(x=>SHAPES[x]).join("、")}</span>`);
  if(s.price_min!=null||s.price_max!=null) c.push(`<span class="chip price">💰 ${s.price_min!=null?Number(s.price_min).toLocaleString():"0"} ～ ${s.price_max!=null?Number(s.price_max).toLocaleString()+" 元":"不限"}</span>`);
  if(s.acreage_min!=null||s.acreage_max!=null) c.push(`<span class="chip">📐 ${s.acreage_min!=null?s.acreage_min:0} ～ ${s.acreage_max!=null?s.acreage_max+" 坪":"不限"}</span>`);
  return c.join("");
}
function renderSubs(){
  const el=document.getElementById("view-subs");
  const subs=(subsDoc&&subsDoc.subscriptions)||[];
  if(!subs.length){el.innerHTML=`<div class="empty">目前沒有任何訂閱條件。</div>`;return;}
  el.innerHTML=
    `<div class="summary">這些是排程實際監控的搜尋條件（唯讀）。要新增／修改請直接改 repo 的 <b>subscriptions.json</b>。</div>`+
    subs.map((s,i)=>`
    <div class="sub-card ${s.enabled?"":"disabled"}" style="--edge:${EDGE[i%EDGE.length]}">
      <div class="sub-name">${esc(s.name)||"未命名訂閱"}${s.enabled?"":'<span class="off-tag">已暫停</span>'}</div>
      <div class="chips">${summaryChips(s)}</div>
    </div>`).join("");
}

// ===== 關注（唯讀顯示 watchlist.json）=====
function renderWatch(){
  const el=document.getElementById("view-watch");
  const ids=Object.keys(watchDoc.items||{});
  if(!ids.length){el.innerHTML=`<div class="empty">目前沒有關注中的物件。<br>關注清單存在 repo 的 <b>watchlist.json</b>。</div>`;return;}
  const rows=ids.map(id=>{
    const live=(latest&&latest.listings&&latest.listings[id])||{};
    const w=watchDoc.items[id];
    return {listing_id:id,title:live.title||w.title||("物件 "+id),url:live.url||w.url,image:live.image,district:live.district,community:live.community,total_monthly:live.total_monthly,kind_name:live.kind_name,rooms:live.rooms,size_ping:live.size_ping,floor:live.floor,updated_rel:live.updated_rel,posted_at:live.posted_at,first_seen:live.first_seen,status:live.status,note:w.note};
  });
  const cnt={};rows.forEach(r=>{const d=r.district||"其他";cnt[d]=(cnt[d]||0)+1;});
  const dists=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  if(watchFilter&&!cnt[watchFilter]) watchFilter="";
  const shown=(watchFilter?rows.filter(r=>(r.district||"其他")===watchFilter):rows).sort(byRecency);
  el.innerHTML=`<div class="filters"><div class="fld wide"><label>只看區域</label>`+
    `<select class="sel-input" onchange="onWatchFilter(this.value)">`+
    `<option value="">全部區域（${rows.length}）</option>`+
    dists.map(d=>`<option value="${esc(d)}" ${watchFilter===d?"selected":""}>${esc(d)}（${cnt[d]}）</option>`).join("")+
    `</select></div></div>`+
    `<div class="summary">關注 ${shown.length} 筆　排程會持續追蹤狀態變化</div>`+
    shown.map(r=>listingCard(r,{stripe:r.status==="removed"?"var(--danger)":"var(--accent)",flag:r.status==="removed"?{cls:"flag-off",txt:"❌ 已下架"}:null})).join("");
}
function onWatchFilter(v){watchFilter=v;renderWatch();document.getElementById("view-watch").scrollIntoView({block:"start"});}

function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}

boot();
</script>
